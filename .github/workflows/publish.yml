name: publish

# Publishes to PyPI when a version tag is pushed (e.g. v1.5.0). It uses
# PyPI's trusted publishing: no token is stored in the repository, but the
# project must first be registered on PyPI as a trusted publisher for this
# repository, this workflow and the 'pypi' environment (see CONTRIBUTING.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check that the tag is the version of the package
        shell: bash
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('mcp_data_platform_toolkit/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME is not the version of the package (v$version)."
            exit 1
          fi
      - name: Build the wheel and the source archive
        run: |
          python -m pip install build
          python -m build
      - name: Check what the archives carry
        run: python .github/scripts/check_dist.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
